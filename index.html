<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herhsin | 管理員安全授權系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #39ff14;
            --deep-black: #050507;
            --glass-card-bg: rgba(10, 10, 15, 0.9);
        }

        body {
            background-color: var(--deep-black);
            color: #f0f0f0;
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 242, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(0, 242, 255, 0.05) 0%, transparent 30%);
        }

        .tech-font { font-family: 'Orbitron', sans-serif; }

        .highway-lines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.2; pointer-events: none;
        }
        .line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            height: 1px; width: 300px;
            animation: flow 6s infinite linear;
            will-change: transform;
        }
        @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
        @keyframes flow {
            from { transform: translateX(-100vw) translateY(100vh) rotate(-45deg); }
            to { transform: translateX(100vw) translateY(-100vh) rotate(-45deg); }
        }

        .glass-panel {
            background: var(--glass-card-bg);
            border: 1px solid rgba(0, 242, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .nav-btn {
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-btn.active {
            background: rgba(0, 242, 255, 0.08);
            border-left: 4px solid var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: inset 10px 0 20px -10px rgba(0, 242, 255, 0.2);
        }

        .nav-btn.active svg {
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }

        .hud-border { position: relative; }
        .hud-border::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 2px solid var(--neon-blue); border-left: 2px solid var(--neon-blue);
        }
        .hud-border::after {
            content: ''; position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px;
            border-bottom: 2px solid var(--neon-blue); border-right: 2px solid var(--neon-blue);
        }

        .page-content { display: none; }
        .page-content.active { display: block; animation: fadeIn 0.5s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-action {
            background: linear-gradient(135deg, rgba(0,242,255,0.2), rgba(0,242,255,0.05));
            border: 1px solid rgba(0,242,255,0.3);
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-action:hover:not(:disabled) {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 50;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .modal.active { display: flex; }

        .status-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .status-ok { background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .status-warning { background: rgba(255, 215, 0, 0.1); color: gold; border: 1px solid gold; }
        .status-none { background: rgba(255, 0, 0, 0.1); color: #ff4444; border: 1px solid #ff4444; }

        .neon-guardian {
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green), 0 0 15px rgba(57, 255, 20, 0.5);
            letter-spacing: 4px;
            position: relative;
            background: rgba(57, 255, 20, 0.1);
            padding: 4px 12px;
            border: 1px solid rgba(57, 255, 20, 0.3);
        }

        input[type="date"] { color-scheme: dark; }

        /* 管理員權限控制 CSS */
        .admin-only, .admin-only-flex, .admin-only-cell { display: none !important; }
        body.is-admin .admin-only { display: block !important; }
        body.is-admin .admin-only-flex { display: flex !important; }
        body.is-admin .admin-only-cell { display: table-cell !important; }
        body.is-admin .admin-hidden { display: none !important; }

        .file-upload-area {
            border: 1px dashed rgba(0, 242, 255, 0.3);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
        }
        
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--neon-blue);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== 頁面大標題 ===== */
        .hero-title {
            display: flex;
            align-items: stretch;
            gap: 18px;
            padding: 6px 0;
        }
        .hero-accent {
            width: 6px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--neon-blue), var(--neon-green));
            box-shadow: 0 0 14px var(--neon-blue), 0 0 30px rgba(0, 242, 255, 0.4);
        }
        .hero-text {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 10px;
        }
        .hero-text::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, var(--neon-blue), rgba(57, 255, 20, 0.5), transparent);
        }
        .hero-sub {
            font-size: 11px;
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: var(--neon-blue);
            opacity: 0.85;
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
        }
        .hero-main {
            font-size: clamp(2rem, 5.5vw, 3.6rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            line-height: 1.1;
            background: linear-gradient(90deg, #ffffff 0%, var(--neon-blue) 25%, var(--neon-green) 50%, var(--neon-blue) 75%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 0 14px rgba(0, 242, 255, 0.45));
            animation: titleShine 5s linear infinite;
        }
        @keyframes titleShine { to { background-position: 200% center; } }
        .hero-title.switching .hero-text { animation: titleIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes titleIn {
            from { opacity: 0; transform: translateX(-28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .hero-main, .hero-title.switching .hero-text { animation: none; }
        }

        #error-banner {
            display: none;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff8888;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            border-radius: 4px;
        }

        :root {
            --neon-blue: #19e6ff;
            --neon-green: #4dffa6;
            --deep-black: #05070d;
            --amber: #ffc247;
            --danger: #ff5d73;
            --line: rgba(120, 200, 255, 0.14);
        }
        body { background-image: none; }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background-image:
                radial-gradient(900px 520px at 85% -10%, rgba(25, 230, 255, 0.16), transparent 60%),
                radial-gradient(700px 500px at -10% 110%, rgba(77, 255, 166, 0.07), transparent 60%),
                linear-gradient(rgba(120, 200, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 200, 255, 0.035) 1px, transparent 1px);
            background-size: auto, auto, 44px 44px, 44px 44px;
        }
        * { scrollbar-width: thin; scrollbar-color: rgba(25, 230, 255, 0.35) transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(25, 230, 255, 0.28); border-radius: 8px; }
        :focus-visible { outline: 2px solid var(--neon-blue); outline-offset: 2px; }

        .glass-panel {
            background: linear-gradient(180deg, rgba(18, 26, 44, 0.9), rgba(10, 14, 24, 0.93));
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        aside.glass-panel {
            border-radius: 0;
            background: linear-gradient(180deg, rgba(10, 16, 30, 0.96), rgba(6, 9, 16, 0.98));

        /* 表格 */
        #page-dashboard thead { background: rgba(25, 230, 255, 0.05); }
        #page-dashboard thead th { color: #8fb4c9; font-weight: 500; font-size: 0.85rem; letter-spacing: 0.12em; }
        #dashboard-fleet-list tr { transition: background 0.2s; }
        #dashboard-fleet-list tr:hover { background: linear-gradient(90deg, rgba(25, 230, 255, 0.08), transparent); }

        /* 車牌標籤：本系統的視覺主角 */
        .plate-chip {
            display: inline-block; font-family: 'Orbitron', sans-serif; font-weight: 700;
            letter-spacing: 0.14em; padding: 4px 12px; border-radius: 6px; color: #eaffff;
            background: linear-gradient(180deg, #0f1b2d, #0a1220);
            border: 1px solid rgba(25, 230, 255, 0.45);
            box-shadow: inset 0 0 0 2px rgba(5, 7, 13, 0.9), inset 0 0 0 3px rgba(25, 230, 255, 0.18), 0 0 14px -4px rgba(25, 230, 255, 0.5);
        }
        .plate-chip-lg { font-size: 1.25rem; padding: 6px 16px; }

        /* 狀態標籤 */
        .status-tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
        .status-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
        .status-ok { background: rgba(77, 255, 166, 0.1); color: var(--neon-green); border-color: rgba(77, 255, 166, 0.5); }
        .status-warning { background: rgba(255, 194, 71, 0.1); color: var(--amber); border-color: rgba(255, 194, 71, 0.5); }
        .status-none { background: rgba(255, 93, 115, 0.1); color: var(--danger); border-color: rgba(255, 93, 115, 0.5); }

        /* 按鈕（原本黑字疊在深色底，對比不足） */
        button.btn-action {
            border-radius: 10px; color: #d9fbff; letter-spacing: 0.06em;
            background: linear-gradient(135deg, rgba(25, 230, 255, 0.28), rgba(25, 230, 255, 0.06));
            border: 1px solid rgba(25, 230, 255, 0.45);
        }
        button.btn-action:hover:not(:disabled) { background: var(--neon-blue); color: #021016; box-shadow: 0 0 22px rgba(25, 230, 255, 0.55); }

        /* 保單卡片 */
        #plate-grid > .glass-panel { transition: border-color 0.25s, box-shadow 0.25s; }
        #plate-grid > .glass-panel:hover { border-color: rgba(25, 230, 255, 0.45); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 24px -8px rgba(25, 230, 255, 0.5); }

        /* 視窗與表單 */
        .modal { background: rgba(2, 4, 10, 0.78); backdrop-filter: blur(4px); }
        .modal.active .glass-panel { animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
        @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
        .modal input, .modal select { border-radius: 8px; background: rgba(2, 6, 14, 0.7); border-color: rgba(120, 200, 255, 0.18); transition: border-color 0.2s, box-shadow 0.2s; }
        .modal input:focus, .modal select:focus { border-color: var(--neon-blue); box-shadow: 0 0 0 3px rgba(25, 230, 255, 0.16); outline: none; }
        .modal select option { background: #0b1220; }
        .file-upload-area { border-radius: 10px; }

        .empty-state { padding: 56px 16px; text-align: center; color: #7f93a6; font-size: 0.95rem; }
        @media (prefers-reduced-motion: reduce) { .modal.active .glass-panel { animation: none; } }

        /* 車輛檢驗頁 */
        #page-inspect thead { background: rgba(25, 230, 255, 0.05); }
        #page-inspect thead th { color: #8fb4c9; font-weight: 500; font-size: 0.85rem; letter-spacing: 0.12em; padding: 16px; }
        #inspect-list tr { border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.2s; }
        #inspect-list tr:hover { background: linear-gradient(90deg, rgba(25, 230, 255, 0.08), transparent); }
        .status-pending { background: rgba(160, 176, 195, 0.1); color: #9fb0c3; border-color: rgba(160, 176, 195, 0.4); }
        .inspect-badge { position: absolute; top: 8px; right: 10px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 20px; text-align: center; background: var(--amber); color: #1a1200; }
        .inspect-badge.danger { background: var(--danger); color: #fff; }
        .inspect-alert { border: 1px solid rgba(255, 194, 71, 0.45); background: rgba(255, 194, 71, 0.08); color: #ffe7b0; border-radius: 12px; padding: 14px 18px; font-size: 0.95rem; }
        .inspect-alert.danger { border-color: rgba(255, 93, 115, 0.5); background: rgba(255, 93, 115, 0.09); color: #ffd5db; }
    </style>
</head>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyMEoizEmworjcxFkeaSVE9TlFcDK_FZsTmnZAkt4cmGZII4V1uvwy_iGOa2Q2t6X4vzA/exec";

        // 取得「台灣時區」的 YYYY-MM-DD 字串；日期比較一律用這個字串，避免時區與時分秒造成誤判
        function toTaiwanYMD(dateInput) {
            if (!dateInput) return '';
            if (typeof dateInput === 'string') {
                const m = dateInput.trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
                if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            }
            const d = (dateInput instanceof Date) ? dateInput : new Date(dateInput);
            if (isNaN(d.getTime())) return '';
            const parts = new Intl.DateTimeFormat('en-US', {
                year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Taipei'
            }).formatToParts(d);
            const get = t => parts.find(p => p.type === t).value;
            return `${get('year')}-${get('month')}-${get('day')}`;
        }

        function addDaysYMD(ymd, days) {
            const [y, m, d] = ymd.split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
        }

        function formatToTaiwanString(dateInput) {
            return toTaiwanYMD(dateInput) || '---';
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function openPdf(fileId) {
            if (!fileId) {
                alert("此車輛目前尚未上傳保單 PDF。");
                return;
            }
            window.open(`https://drive.google.com/file/d/${encodeURIComponent(fileId)}/view`, '_blank', 'noopener');
        }

        // 統一的 API 呼叫：含逾時保護，避免伺服器沒回應時畫面永遠卡在「同步中」
        async function callApi(payload, timeoutMs = 30000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const resp = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                if (!resp.ok) throw new Error(`伺服器回應錯誤 (HTTP ${resp.status})`);
                const text = await resp.text();
                try { return JSON.parse(text); }
                catch (_) { throw new Error('伺服器回傳格式不正確，請確認 Apps Script 已部署為「所有人皆可存取」'); }
            } catch (err) {
                if (err.name === 'AbortError') throw new Error('連線逾時，請稍後再試');
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }
    </script>

                        <button type="button" onclick="clearFileSelection()" class="text-red-500 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg></button>

    <script>
        let isAdmin = false;
        let adminKey = '';
        let fleetData = [];
        let currentFileBase64 = null;
        let currentFileName = null;
        let fetchPromise = null;
        let syncHideTimer = null;
        const MAX_PDF_MB = 8;
        const ADMIN_STORAGE_KEY = 'herhsin_admin_key';

        window.addEventListener('DOMContentLoaded', () => {
            checkAdminSession();
            fetchFleetData();
            updateClock();
            setInterval(updateClock, 1000);

            document.getElementById('login-pwd').addEventListener('keydown', e => {
                if (e.key === 'Enter') handleLogin();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    toggleModal('login-modal', false);
                    toggleModal('vehicle-modal', false);
                    toggleModal('inspect-modal', false);
                }
            });
        });

        function hideError() {
            document.getElementById('error-banner').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('error-banner').style.display = 'block';
            document.getElementById('error-message').textContent = msg;
        }

        // 同一時間只跑一個讀取；重複點擊會共用同一個請求
        function fetchFleetData() {
            if (fetchPromise) return fetchPromise;
            fetchPromise = doFetchFleet().finally(() => { fetchPromise = null; });
            return fetchPromise;
        }

        async function refreshAfterWrite() {
            if (fetchPromise) await fetchPromise;
            return fetchFleetData();
        }

        async function doFetchFleet() {
            const st = document.getElementById('sync-status');
            clearTimeout(syncHideTimer);
            hideError();
            st.style.display = 'inline';
            st.textContent = "同步中...";
            try {
                const data = await callApi({ action: 'fetch' });
                if (data && data.status === 'error') throw new Error(data.message || '未知錯誤');
                fleetData = Array.isArray(data) ? data : [];
                st.textContent = "已更新";
            } catch (error) {
                st.textContent = "同步失敗";
                showError(error.message);
            } finally {
                renderFleet();
                syncHideTimer = setTimeout(() => { st.style.display = 'none'; }, 2000);
            }
        }

        async function handleVehicleSubmit(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const plateInput = document.getElementById('v-plate');
            const plate = plateInput.value.trim().toUpperCase();
            const start = document.getElementById('v-start').value || "";
            const expiry = document.getElementById('v-expiry').value || "";
            const isNew = !plateInput.readOnly;

            if (!plate) { alert("請輸入車牌號碼"); return; }
            if (start && expiry && start > expiry) { alert("起始日不可晚於到期日"); return; }
            if (isNew && fleetData.some(v => String(v.plate).toUpperCase() === plate)) {
                if (!confirm(`車牌 ${plate} 已存在，確定要覆蓋原有資料嗎？`)) return;
            }

            const btn = document.getElementById('btn-save-vehicle');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> 同步中...';

            const vehicle = {
                action: 'save',
                password: adminKey,
                plate,
                model: document.getElementById('v-model').value.trim(),
                company: document.getElementById('v-company').value,
                start,
                expiry,
                pdfData: currentFileBase64,
                pdfName: currentFileName || "",
                fileId: document.getElementById('v-fileId').value || ""
            };

            try {
                const res = await callApi(vehicle, 90000);
                if (res.status === 'success') {
                    toggleModal('vehicle-modal', false);
                    await refreshAfterWrite();
                } else {
                    throw new Error(res.message || '未知錯誤');
                }
            } catch (err) {
                alert("存儲失敗：" + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '同步雲端資料庫';
            }
        }

        async function deleteVehicle(index) {
            if (!isAdmin) return;
            const v = fleetData[index];
            if (!v) return;
            if (!confirm(`確定要刪除車輛 ${v.plate} 嗎？`)) return;

            try {
                const res = await callApi({ action: 'delete', password: adminKey, plate: v.plate, fileId: v.fileId || "" });
                if (res.status === 'success') await refreshAfterWrite();
                else throw new Error(res.message || '未知錯誤');
            } catch (err) { alert("刪除失敗：" + err.message); }
        }

        function handleFileChange(input) {
            const file = input.files[0];
            if (!file) return;
            const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
            if (!isPdf) { alert("請選擇 PDF 檔案"); input.value = ""; return; }
            if (file.size > MAX_PDF_MB * 1024 * 1024) {
                alert(`檔案過大，請上傳 ${MAX_PDF_MB} MB 以內的 PDF`);
                input.value = "";
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                currentFileBase64 = e.target.result;
                currentFileName = file.name;
                document.getElementById('file-preview-strip').classList.remove('hidden');
                document.getElementById('selected-file-name').textContent = file.name;
            };
            reader.onerror = () => alert("檔案讀取失敗，請重新選擇");
            reader.readAsDataURL(file);
        }

        function clearFileSelection() {
            document.getElementById('v-pdf').value = "";
            document.getElementById('file-preview-strip').classList.add('hidden');
            currentFileBase64 = null;
            currentFileName = null;
        }

        async function handleLogin() {
            const input = document.getElementById('login-pwd');
            const pwd = input.value;
            if (!pwd) return;
            const btn = document.getElementById('btn-login-submit');
            btn.disabled = true;

            try {
                const res = await callApi({ action: 'login', password: pwd });
                if (res.status === 'success') {
                    isAdmin = true;
                    adminKey = pwd;
                    try { sessionStorage.setItem(ADMIN_STORAGE_KEY, pwd); } catch (_) {}
                    input.value = '';
                    applyAdminUI();
                    toggleModal('login-modal', false);
                    renderFleet();
                } else { alert("金鑰錯誤"); }
            } catch (err) { alert("驗證失敗：" + err.message); } finally { btn.disabled = false; }
        }

        function logout() {
            isAdmin = false;
            adminKey = '';
            try { sessionStorage.removeItem(ADMIN_STORAGE_KEY); } catch (_) {}
            applyAdminUI();
            renderFleet();
        }

        function applyAdminUI() {
            document.body.classList.toggle('is-admin', isAdmin);
        }

        function checkAdminSession() {
            let key = null;
            try { key = sessionStorage.getItem(ADMIN_STORAGE_KEY); } catch (_) {}
            if (key) {
                isAdmin = true;
                adminKey = key;
                applyAdminUI();
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            const titles = {
                dashboard: ['車輛總覽', 'Fleet Overview'],
                plans: ['保單管理', 'Policy Vault'],
                inspect: ['車輛檢驗', 'Inspection Log']
            };
            const [zh, en] = titles[pageId] || titles.dashboard;
            document.getElementById('page-title-text').textContent = zh;
            document.getElementById('page-title-sub').textContent = en;
            const box = document.getElementById('page-title-box');
            box.classList.remove('switching');
            void box.offsetWidth; // 重新觸發切換動畫
            box.classList.add('switching');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(`'${pageId}'`)));
        }

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        function openAddVehicleModal() {
            if (!isAdmin) return;
            document.getElementById('modal-title').textContent = "雲端資產註冊";
            document.getElementById('vehicle-form').reset();
            document.getElementById('v-index').value = "";
            document.getElementById('v-plate').readOnly = false;
            document.getElementById('v-fileId').value = "";
            clearFileSelection();
            toggleModal('vehicle-modal', true);
        }

        function openEditModal(index) {
            if (!isAdmin) return;
            const v = fleetData[index];
            if (!v) return;
            document.getElementById('modal-title').textContent = "編輯車輛資料";
            document.getElementById('v-index').value = index;
            document.getElementById('v-plate').value = v.plate;
            document.getElementById('v-plate').readOnly = true;
            document.getElementById('v-model').value = v.model || "";

            // 若資料庫中的保險公司不在下拉選單內，補上該選項，避免存檔時變成空白
            const sel = document.getElementById('v-company');
            const company = v.company || "富邦產險";
            if (![...sel.options].some(o => o.value === company)) sel.add(new Option(company, company));
            sel.value = company;

            document.getElementById('v-start').value = toTaiwanYMD(v.start);
            document.getElementById('v-expiry').value = toTaiwanYMD(v.expiry);

            document.getElementById('v-fileId').value = v.fileId || "";
            clearFileSelection();
            toggleModal('vehicle-modal', true);
        }

        function renderFleet() {
            const list = document.getElementById('dashboard-fleet-list');
            const grid = document.getElementById('plate-grid');
            list.innerHTML = '';
            grid.innerHTML = '';

            let warningCount = 0, missingCount = 0;
            const today = toTaiwanYMD(new Date());
            const warnLimit = addDaysYMD(today, 30);

            fleetData.forEach((v, i) => {
                let statusClass = 'status-ok', statusText = '期限內';

                const startYMD = toTaiwanYMD(v.start);
                const expiryYMD = toTaiwanYMD(v.expiry);
                const displayStart = startYMD || '---';
                const displayExpiry = expiryYMD || '---';

                if (!expiryYMD) {
                    statusClass = 'status-none'; statusText = '待補齊'; missingCount++;
                } else if (expiryYMD < today) {
                    statusClass = 'status-none'; statusText = '已過期'; missingCount++;
                } else if (expiryYMD <= warnLimit) {
                    statusClass = 'status-warning'; statusText = '即將到期'; warningCount++;
                }

                const plate = escapeHtml(v.plate);

                // 總覽表格列
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition border-b border-white/5";

                const actionBtn = isAdmin
                    ? `<button onclick="openEditModal(${i})" class="px-3 py-1 border border-cyan-500/50 text-cyan-400 text-xs hover:bg-cyan-500 hover:text-black transition rounded">編輯</button>`
                    : `<button onclick="openPdf(fleetData[${i}].fileId)" class="px-3 py-1 border border-gray-600 text-gray-400 text-xs hover:border-cyan-400 hover:text-cyan-400 transition rounded">檢視</button>`;

                tr.innerHTML = `
                    <td class="p-4"><span class="plate-chip">${plate}</span></td>
                    <td class="p-4 text-gray-400 text-base">${escapeHtml(v.model) || '---'}</td>
                    <td class="p-4 text-base text-white/80">${escapeHtml(v.company) || '---'}</td>
                    <td class="p-4"><span class="status-tag ${statusClass}">${statusText}</span></td>
                    <td class="p-4 text-base opacity-70">${displayStart}</td>
                    <td class="p-4 text-base opacity-70">${displayExpiry}</td>
                    <td class="p-4 text-center">${actionBtn}</td>
                    ${isAdmin ? `<td class="p-4 text-center"><button onclick="deleteVehicle(${i})" class="text-red-500/50 hover:text-red-500 transition"><svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></td>` : ''}
                `;
                list.appendChild(tr);

                // 保單管理卡片
                const card = document.createElement('div');
                card.className = "glass-panel p-5 hud-border flex flex-col items-center group relative overflow-hidden";

                const pdfAvailable = !!v.fileId;
                const viewBtnClass = pdfAvailable
                    ? "bg-cyan-500 text-black hover:bg-white"
                    : "bg-white/5 text-gray-700 border border-white/5 cursor-not-allowed";

                card.innerHTML = `
                    <div class="w-16 h-20 bg-gradient-to-br ${pdfAvailable ? 'from-cyan-500/20' : 'from-gray-900'} to-transparent border border-white/10 rounded-lg flex items-center justify-center mb-4">
                        <svg class="w-8 h-8 ${pdfAvailable ? 'text-cyan-400' : 'text-gray-800'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    </div>
                    <span class="plate-chip plate-chip-lg mb-2">${plate}</span>
                    <p class="text-[10px] text-gray-500 uppercase mb-4">${escapeHtml(v.company) || '未知公司'}</p>
                    <div class="w-full space-y-2">
                        <button onclick="openPdf(fleetData[${i}].fileId)" class="w-full py-2 text-[10px] font-bold uppercase transition ${viewBtnClass}">
                            ${pdfAvailable ? '檢視電子保單' : '保單尚未上傳'}
                        </button>
                        <div class="flex justify-between items-center px-1">
                            <span class="text-[9px] text-gray-600 tech-font">到期: ${displayExpiry}</span>
                            <span class="status-tag ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (!fleetData.length) {
                list.innerHTML = '<tr><td colspan="8" class="empty-state">目前沒有車輛資料。登入後按「註冊新車輛」即可新增。</td></tr>';
                grid.innerHTML = '<div class="empty-state glass-panel col-span-full">尚無已存檔的電子保單。</div>';
            }

            renderInspect();

            document.getElementById('stat-total').textContent = fleetData.length.toString().padStart(2, '0');
            document.getElementById('stat-warning').textContent = warningCount.toString().padStart(2, '0');
            document.getElementById('stat-missing').textContent = missingCount.toString().padStart(2, '0');
        }

        // ===== 車輛檢驗 =====
        function addMonthsYMD(ymd, n) {
            const [y, m, d] = ymd.split('-').map(Number);
            const t = new Date(Date.UTC(y, m - 1 + n, 1));
            const lastDay = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
            t.setUTCDate(Math.min(d, lastDay));
            return t.toISOString().slice(0, 10);
        }

        function autoNextInspect() {
            const last = document.getElementById('i-last').value;
            const cycle = parseInt(document.getElementById('i-cycle').value, 10);
            if (last && cycle) document.getElementById('i-next').value = addMonthsYMD(last, cycle);
        }

        function renderInspect() {
            const list = document.getElementById('inspect-list');
            const today = toTaiwanYMD(new Date());
            const warnLimit = addDaysYMD(today, 30);
            const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
            const counts = [0, 0, 0, 0]; // 逾期、30天內、正常、未記錄
            const urgent = [];

            const items = fleetData.map((v, i) => {
                const next = toTaiwanYMD(v.nextInspect);
                let rank = 3, cls = 'status-pending', text = '未記錄', days = '---';
                if (next) {
                    const diff = dayDiff(today, next);
                    if (diff < 0) { rank = 0; cls = 'status-none'; text = '已逾期'; days = `逾期 ${-diff} 天`; }
                    else if (next <= warnLimit) { rank = 1; cls = 'status-warning'; text = '即將到期'; days = diff === 0 ? '今天到期' : `剩 ${diff} 天`; }
                    else { rank = 2; cls = 'status-ok'; text = '正常'; days = `剩 ${diff} 天`; }
                }
                counts[rank]++;
                if (rank < 2) urgent.push(`${escapeHtml(v.plate)}（${days}）`);
                return { v, i, next, rank, cls, text, days };
            }).sort((a, b) => a.rank - b.rank || a.next.localeCompare(b.next));

            list.innerHTML = items.length ? items.map(o => `
                <tr>
                    <td class="p-4"><span class="plate-chip">${escapeHtml(o.v.plate)}</span></td>
                    <td class="p-4 text-gray-400">${escapeHtml(o.v.model) || '---'}</td>
                    <td class="p-4 opacity-70">${toTaiwanYMD(o.v.lastInspect) || '---'}</td>
                    <td class="p-4 opacity-70">${o.next || '---'}</td>
                    <td class="p-4 tech-font">${o.days}</td>
                    <td class="p-4"><span class="status-tag ${o.cls}">${o.text}</span></td>
                    <td class="p-4 text-gray-400 text-sm">${escapeHtml(o.v.inspectNote) || ''}</td>
                    <td class="p-4 text-center admin-only-cell"><button onclick="openInspectModal(${o.i})" class="px-3 py-1 border border-cyan-500/50 text-cyan-400 text-xs hover:bg-cyan-500 hover:text-black transition rounded">記錄檢驗</button></td>
                </tr>`).join('')
                : '<tr><td colspan="8" class="empty-state">目前沒有車輛資料，請先到車輛總覽新增車輛。</td></tr>';

            document.getElementById('inspect-summary').innerHTML =
                `<span class="status-tag status-none">已逾期 ${counts[0]}</span>` +
                `<span class="status-tag status-warning">30 天內 ${counts[1]}</span>` +
                `<span class="status-tag status-ok">正常 ${counts[2]}</span>` +
                `<span class="status-tag status-pending">未記錄 ${counts[3]}</span>`;

            const alertBox = document.getElementById('inspect-alert');
            alertBox.style.display = urgent.length ? 'block' : 'none';
            alertBox.classList.toggle('danger', counts[0] > 0);
            alertBox.innerHTML = `有 ${urgent.length} 輛車需要安排檢驗：${urgent.join('、')}`;

            const badge = document.getElementById('inspect-badge');
            badge.style.display = urgent.length ? 'block' : 'none';
            badge.textContent = urgent.length;
            badge.classList.toggle('danger', counts[0] > 0);
        }

        function openInspectModal(index) {
            if (!isAdmin) return;
            const v = fleetData[index];
            if (!v) return;
            document.getElementById('i-plate').value = v.plate;
            document.getElementById('i-plate-label').innerHTML =
                `<span class="plate-chip">${escapeHtml(v.plate)}</span><span class="text-gray-500 text-sm ml-3">${escapeHtml(v.model)}</span>`;
            document.getElementById('i-last').value = toTaiwanYMD(v.lastInspect);
            document.getElementById('i-next').value = toTaiwanYMD(v.nextInspect);
            document.getElementById('i-note').value = v.inspectNote || '';
            document.getElementById('i-cycle').value = '';
            toggleModal('inspect-modal', true);
        }

        async function handleInspectSubmit(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const last = document.getElementById('i-last').value || '';
            const next = document.getElementById('i-next').value || '';
            if (last && next && next < last) { alert("下次檢驗日不可早於最近檢驗日"); return; }

            const btn = document.getElementById('btn-save-inspect');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> 同步中...';
            try {
                const res = await callApi({
                    action: 'saveInspection', password: adminKey,
                    plate: document.getElementById('i-plate').value,
                    lastInspect: last, nextInspect: next,
                    inspectNote: document.getElementById('i-note').value.trim()
                });
                if (res.status !== 'success') throw new Error(res.message || '未知錯誤');
                toggleModal('inspect-modal', false);
                await refreshAfterWrite();
            } catch (err) {
                alert("存儲失敗：" + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '儲存檢驗紀錄';
            }
        }

        function updateClock() {
            const time = new Date().toLocaleTimeString('zh-TW', { hourCycle: 'h23', timeZone: 'Asia/Taipei' });
            const clockEl = document.getElementById('current-time');
            if (clockEl) clockEl.textContent = time;
        }
    </script>
</body>
